# Shared sandbox infra — keep this stack running; point side projects at it.
# Other Compose apps join with:
#   networks:
#     sandbox:
#       external: true
#
# MySQL: use Aiven (managed). Postgres / Redis: add later when needed.
# Laravel on host PHP-FPM: mount app path + /run/php into Caddy (see Caddyfile).

name: sandbox-infra

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/etc/caddy/certs:ro
      - ./caddy/site:/srv:ro
      - /opt/apps/sisbio-new:/opt/apps/sisbio-new:ro
      - /run/php:/run/php
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - sandbox

networks:
  sandbox:
    name: sandbox

volumes:
  caddy_data:
  caddy_config:
